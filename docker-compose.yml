services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/lostfound.db
      UPLOAD_DIR: /data/uploads
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: '["http://localhost:8080"]'
    volumes: [data:/data]
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  data:
